# .github/workflows/release.yml
#
# KeyPress Ultimate, tag-triggered release build.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Produces, on one GitHub Release:
#   KeyPress-Ultimate-1.2.3-universal.dmg          (macOS first install)
#   KeyPress-Ultimate-1.2.3-universal-mac.zip      (macOS auto-update payload)
#   KeyPress-Ultimate-Setup-1.2.3-x64.exe          (Windows install + auto-update)
#   KeyPress-Ultimate-1.2.3-x64-portable.exe       (Windows, no install)
#   SHA256SUMS.txt                                 (verified by the in-app updater)
#
# Signing, in one paragraph: the macOS build is signed with a SELF-SIGNED
# certificate held in the MAC_CERT_P12 / MAC_CERT_PASSWORD secrets, imported into
# a temporary keychain that exists only inside this runner. That is not
# notarization and it does not satisfy Gatekeeper. The first install still needs
# a one-time "Open Anyway". What it buys is a STABLE DESIGNATED REQUIREMENT, so
# macOS keeps the user's Accessibility grant across updates instead of treating
# every build as a new program. If the secret is absent the job falls back to
# ad-hoc signing with a loud warning rather than failing: a release is never
# blocked on a certificate. Windows is not signed at all; SmartScreen warns once.
#
# Full background and the one-time setup: docs/release-process.md

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # prereleases: v1.2.3-beta.1
  workflow_dispatch:

# Needed by softprops/action-gh-release to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # macos-latest is Apple Silicon; the universal build cross-packs x64.
          - os: macos-latest
            label: macOS (universal)
            builder-flag: "--mac"
            artifact: dist-mac
          - os: windows-latest
            label: Windows (x64)
            builder-flag: "--win"
            artifact: dist-win

    steps:
      # Pinned majors, all verified current on 2026-09-09:
      #   actions/checkout v7.0.1  actions/setup-node v7.0.0
      #   actions/upload-artifact v7.0.1
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # koffi ships one prebuilt .node per platform+arch as a separate package
      # (@koromix/koffi-darwin-arm64, @koromix/koffi-darwin-x64, ...), each pinned
      # with "os" and "cpu" in its package.json. npm would normally install ONLY
      # the runner's own arch, so an arm64 macOS runner has no x64 koffi.node and
      # the universal build ships a slice that dies at the first koffi.load().
      #
      # The repo's .npmrc sets force=true, which is what makes `npm ci` install
      # all three anyway. This step is the belt to that braces: if the foreign
      # arch is missing for any reason, unpack the tarball straight into
      # node_modules. electron-builder still picks it up, because koffi declares
      # it as an optionalDependency and it is therefore part of the resolved tree.
      #
      # Not usable alternatives, for the record:
      #   - adding them as plain dependencies without force=true -> npm hard-fails
      #     with EBADPLATFORM ("wanted {os:darwin,cpu:x64} current {cpu:arm64}")
      #   - `npm ci --cpu=x64` -> koffi's install script (cnoke) tries to compile
      #     from source and fails
      #
      # ORDERING: this must run AFTER every npm command that writes node_modules.
      # `npm ci` / `npm install` re-reconcile the tree against the lockfile and
      # prune a hand-unpacked package straight back out. `npm pack` below only
      # downloads a tarball, and `npm run` does not touch node_modules, so this
      # position is safe, but if you add an install step later, move this after
      # it or repeat it.
      # -----------------------------------------------------------------------
      - name: Ensure both macOS koffi prebuilds are present
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          KV="$(node -p "require('./node_modules/koffi/package.json').version")"
          echo "koffi version: $KV"
          mkdir -p "$RUNNER_TEMP/koffi-pack"
          for ARCH in x64 arm64; do
            DIR="node_modules/@koromix/koffi-darwin-$ARCH"
            if [ -f "$DIR/darwin_$ARCH/koffi.node" ]; then
              echo "already present: $DIR"
              continue
            fi
            echo "re-injecting $DIR from the registry tarball"
            npm pack "@koromix/koffi-darwin-$ARCH@$KV" --pack-destination "$RUNNER_TEMP/koffi-pack"
            mkdir -p "$DIR"
            tar -xzf "$RUNNER_TEMP/koffi-pack/koromix-koffi-darwin-$ARCH-$KV.tgz" \
                -C "$DIR" --strip-components=1
          done
          echo "--- both slices ---"
          for ARCH in x64 arm64; do
            F="node_modules/@koromix/koffi-darwin-$ARCH/darwin_$ARCH/koffi.node"
            test -f "$F" || { echo "::error::MISSING $F"; exit 1; }
            lipo -info "$F"
          done

      - name: Ensure the Windows koffi prebuild is present
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          KV="$(node -p "require('./node_modules/koffi/package.json').version")"
          DIR="node_modules/@koromix/koffi-win32-x64"
          if [ ! -f "$DIR/win32_x64/koffi.node" ]; then
            echo "re-injecting $DIR from the registry tarball"
            npm pack "@koromix/koffi-win32-x64@$KV" --pack-destination "$RUNNER_TEMP/koffi-pack"
            mkdir -p "$DIR"
            tar -xzf "$RUNNER_TEMP/koffi-pack/koromix-koffi-win32-x64-$KV.tgz" \
                -C "$DIR" --strip-components=1
          fi
          test -f "$DIR/win32_x64/koffi.node" || { echo "::error::MISSING $DIR/win32_x64/koffi.node"; exit 1; }
          echo "ok $DIR/win32_x64/koffi.node"

      # `npm run` does not rewrite node_modules, so the koffi injection above
      # survives this. (This runs typecheck first, then electron-vite build.)
      - name: Build renderer + main bundles
        run: npm run build

      # -----------------------------------------------------------------------
      # Import the self-signed certificate into a TEMPORARY keychain.
      #
      # The non-obvious part: importing the .p12 is not enough. A self-signed
      # certificate is untrusted, and `codesign` refuses an untrusted identity
      # outright. `security find-identity -v -p codesigning` reports "0 valid
      # identities found" and codesign says "no identity found", even with the
      # key sitting right there in the keychain. It has to be trusted for the
      # code-signing policy first, which is what add-trusted-cert does. That is
      # a real change to the machine's trust store, which is why it happens only
      # on a throwaway CI runner and never on a developer's machine.
      #
      # Every failure here is non-fatal: SIGN_IDENTITY simply stays unset and the
      # package step falls back to the ad-hoc identity in electron-builder.yml.
      # -----------------------------------------------------------------------
      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -uo pipefail

          warn_adhoc() {
            echo "::warning title=Signing with an ad-hoc identity::$1 Falling back to ad-hoc signing. The build is valid and installable, but its designated requirement is a per-build cdhash, so macOS will DROP every user's Accessibility grant on the next update. See docs/release-process.md."
          }

          if [ -z "${MAC_CERT_P12:-}" ] || [ -z "${MAC_CERT_PASSWORD:-}" ]; then
            warn_adhoc "MAC_CERT_P12 / MAC_CERT_PASSWORD are not set."
            exit 0
          fi

          KC="$RUNNER_TEMP/keypress-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/keypress-signing.p12"
          CER="$RUNNER_TEMP/keypress-signing.cer"

          echo "$MAC_CERT_P12" | base64 --decode > "$P12" || {
            warn_adhoc "MAC_CERT_P12 is not valid base64."; exit 0; }

          # Remember the original search list so the cleanup step can restore it.
          security list-keychains -d user | sed 's/[ "]//g' | tr '\n' ' ' > "$RUNNER_TEMP/orig-keychains.txt"

          security create-keychain -p "$KC_PW" "$KC"          || { warn_adhoc "create-keychain failed."; exit 0; }
          # No arguments = no lock timeout. The default 300s idle lock will
          # otherwise lock the keychain in the middle of a long universal build.
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(cat "$RUNNER_TEMP/orig-keychains.txt")

          security import "$P12" -k "$KC" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security || {
              warn_adhoc "security import failed (wrong MAC_CERT_PASSWORD, or a p12 macOS cannot read)."; exit 0; }

          # Without this, codesign triggers a GUI keychain prompt that nothing
          # can answer and the build hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" "$KC" >/dev/null 2>&1

          # Trust the certificate for code signing, in the admin domain.
          openssl pkcs12 -in "$P12" -nokeys -legacy -passin "pass:$MAC_CERT_PASSWORD" -out "$CER" 2>/dev/null \
            || openssl pkcs12 -in "$P12" -nokeys -passin "pass:$MAC_CERT_PASSWORD" -out "$CER" 2>/dev/null
          if [ -s "$CER" ]; then
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$CER" \
              || echo "add-trusted-cert failed; the identity check below will decide"
          else
            echo "could not extract the public certificate from the p12"
          fi

          echo "--- identities in the temporary keychain ---"
          security find-identity -v -p codesigning "$KC" || true

          IDENTITY="$(security find-identity -v -p codesigning "$KC" \
            | sed -n 's/.*[0-9A-F]\{40\} "\(.*\)"$/\1/p' | head -1)"

          if [ -z "$IDENTITY" ]; then
            warn_adhoc "The certificate imported but is not a valid code-signing identity (untrusted, expired, or missing its private key)."
            exit 0
          fi

          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KC"        >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KC"       >> "$GITHUB_ENV"
          echo "::notice title=Code signing::Signing with \"$IDENTITY\" from a temporary keychain."

      - name: Package with electron-builder
        shell: bash
        env:
          # The identity is always explicit (either $SIGN_IDENTITY or the "-"
          # in electron-builder.yml), so this only stops electron-builder from
          # ever wandering off and picking up something else on a runner.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder auto-detects the tag and would try to publish;
          # --publish never already stops it, this just avoids surprises.
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            # -c.<dot.path>=value overrides one key of electron-builder.yml.
            npx electron-builder ${{ matrix.builder-flag }} --publish never \
              -c.mac.identity="$SIGN_IDENTITY"
          else
            npx electron-builder ${{ matrix.builder-flag }} --publish never
          fi

      # -----------------------------------------------------------------------
      # The gate. Without it, a universal app with a missing x64 koffi slice
      # builds green, installs fine, and crashes at the first koffi.load() on
      # every Intel Mac, with no signal at build time at all.
      # -----------------------------------------------------------------------
      - name: Verify the packaged macOS app
        if: runner.os == 'macOS'
        run: node scripts/verify-package.mjs

      - name: Assert the release is certificate-signed
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find dist/mac-universal -maxdepth 1 -name '*.app' -print -quit)"
          # codesign writes this to stderr, sometimes with a leading "# ".
          REQ="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^#* *designated => //p')"
          echo "designated requirement: $REQ"
          # A certificate-anchored requirement is the entire point of the cert.
          # If we got here with a cdhash requirement, signing silently degraded.
          case "$REQ" in
            *"certificate leaf"*) echo "ok: requirement is certificate-anchored" ;;
            *) echo "::error::Signed with $SIGN_IDENTITY but the designated requirement is not certificate-anchored: $REQ"; exit 1 ;;
          esac

      - name: Tear down the temporary keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            if [ -f "$RUNNER_TEMP/orig-keychains.txt" ]; then
              security list-keychains -d user -s $(cat "$RUNNER_TEMP/orig-keychains.txt")
            fi
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/keypress-signing.p12" "$RUNNER_TEMP/keypress-signing.cer"
          echo "keychain torn down"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-assets
          # Only the things users download. Skip .blockmap / builder-debug.yml /
          # latest*.yml (those exist for electron-updater, which we do not use).
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*-mac.zip' -o -name '*.exe' \) \
            -exec cp {} out-assets/ \;
          ls -lh out-assets

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out-assets/*
          if-no-files-found: error
          retention-days: 5
          # Installers are already compressed; don't burn CI minutes re-zipping.
          compression-level: 0

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions/download-artifact v8.0.1, softprops/action-gh-release v3.0.3,
      # both verified current on 2026-09-09.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for generate_release_notes comparison base

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: assets

      - name: Generate SHA256SUMS.txt
        working-directory: assets
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          # Sorted, `sha256sum -c`-compatible, basenames only.
          find . -maxdepth 1 -type f -printf '%f\n' | sort | while read -r f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # tag_name defaults to github.ref_name (the pushed tag).
          name: KeyPress Ultimate ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/*.dmg
            assets/*-mac.zip
            assets/*.exe
            assets/SHA256SUMS.txt
          body: |
            ## Install

            **macOS**: download the `.dmg`, drag KeyPress Ultimate to Applications.
            The first launch is blocked because the app is not notarized (no paid
            Apple Developer account). Open **System Settings → Privacy & Security**,
            scroll to **Security**, and press **Open Anyway** next to KeyPress
            Ultimate. Then grant Accessibility when the app asks. Full
            instructions: [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md)

            **Windows**: download the `Setup` `.exe`. SmartScreen will warn that
            the publisher is unknown; click **More info → Run anyway**.
            A `portable` build is also attached if you would rather not install.

            After this first approval, in-app updates install without any further
            security prompts.

            Verify your download against `SHA256SUMS.txt`:

            ```
            # macOS / Linux
            shasum -a 256 -c SHA256SUMS.txt --ignore-missing
            # Windows PowerShell
            Get-FileHash .\KeyPress-Ultimate-Setup-*.exe -Algorithm SHA256
            ```
